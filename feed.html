<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
  <title>BWC - Updates Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #00d9ff;
      --secondary: #ff00ea;
      --accent: #ffed00;
      --bg-dark: #0a0a12;
      --bg-panel: #1a1a2e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 20%, rgba(0, 217, 255, 0.06), transparent 25%),
        radial-gradient(circle at 90% 10%, rgba(255, 0, 234, 0.06), transparent 25%),
        linear-gradient(180deg, rgba(10, 10, 18, 0.95) 0%, #05050a 100%);
      color: var(--text);
      font-family: 'Righteous', cursive;
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.16), rgba(255, 0, 234, 0.12));
      border-bottom: 3px solid var(--primary);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
    }

    .header-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: var(--text);
      color: var(--bg-dark);
    }

    h1 {
      font-family: 'Bebas Neue', cursive;
      color: var(--primary);
      margin: 0;
      font-size: 2.8rem;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--secondary);
    }

    .subhead {
      color: rgba(255, 255, 255, 0.75);
      margin-top: 6px;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--text);
      color: var(--bg-dark);
    }

    .rss-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .rss-link:hover {
      text-decoration: underline;
    }

    .post {
      background: var(--bg-panel);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.18);
      animation: fadeIn 0.45s ease-out;
    }

    .post-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .post-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid var(--primary);
      background: #05050a;
      object-fit: cover;
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.25);
      margin-top: 2px;
    }

    .post-title {
      font-family: 'Bebas Neue', cursive;
      color: var(--accent);
      font-size: 2.1rem;
      margin: 0;
      letter-spacing: 1px;
    }

    .post-date {
      color: var(--primary);
      font-size: 0.95rem;
      margin-bottom: 14px;
      opacity: 0.8;
    }

    .post-image {
      width: 100%;
      border-radius: 8px;
      border: 2px solid rgba(0, 217, 255, 0.5);
      margin-bottom: 14px;
      background: #05050a;
    }

    .post-content {
      line-height: 1.6;
      font-size: 1.05rem;
      white-space: normal;
      color: rgba(255, 255, 255, 0.92);
    }

    .tag-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .tag-pill {
      background: rgba(0, 217, 255, 0.15);
      border: 1px solid rgba(0, 217, 255, 0.4);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: rgba(255, 255, 255, 0.8);
      border: 2px dashed rgba(0, 217, 255, 0.3);
      border-radius: 12px;
      background: rgba(26, 26, 46, 0.6);
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-brand">
    <h1>BWC Feed</h1>
    <div class="subhead">Fresh drops from the BWC universe.</div>
    </div>
    <div class="header-nav">
      <a href="index.html" class="nav-btn">&#8592; Back to Comic</a>
      <a class="nav-btn" href="rss.xml" target="_blank" rel="noopener">RSS Feed</a>
      <a href="media.html" class="nav-btn">Media</a>
    </div>
  </header>

  <div class="container">
    <div id="feedContainer">
      <div class="empty-state">Loading updates...</div>
    </div>

  </div>

  <script>
    const feedContainer = document.getElementById('feedContainer');

    function escapeHtml(str = '') {
      return str.replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch] || ch));
    }

    function renderPost(post) {
      const article = document.createElement('article');
      article.className = 'post';
      article.id = post.id || '';

      const header = document.createElement('div');
      header.className = 'post-header';

      const icon = document.createElement('img');
      icon.className = 'post-icon';
      icon.src = 'boywondericon.png';
      icon.alt = 'Boy Wonder icon';
      icon.loading = 'lazy';

      const title = document.createElement('h2');
      title.className = 'post-title';
      title.textContent = post.title || 'Untitled';

      const date = document.createElement('div');
      date.className = 'post-date';
      const parsedDate = post.date ? new Date(post.date) : null;
      date.textContent = parsedDate && !Number.isNaN(parsedDate) ? parsedDate.toLocaleString() : 'Date not set';

      const titleWrap = document.createElement('div');
      titleWrap.appendChild(title);
      titleWrap.appendChild(date);

      header.appendChild(icon);
      header.appendChild(titleWrap);
      article.appendChild(header);

      if (post.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.src = post.image;
        img.alt = post.title || 'Update image';
        img.loading = 'lazy';
        article.appendChild(img);
      }

      if (post.imageTags && post.imageTags.length) {
        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'tag-list';
        post.imageTags.forEach(tag => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.textContent = tag;
          tagsWrap.appendChild(pill);
        });
        article.appendChild(tagsWrap);
      }

      const content = document.createElement('div');
      content.className = 'post-content';
      const safe = escapeHtml(post.content || '').replace(/\n/g, '<br>');
      content.innerHTML = safe;
      article.appendChild(content);

      feedContainer.appendChild(article);
    }

    async function loadFeed() {
      try {
        const response = await fetch('posts.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Failed to load posts.json');
        const data = await response.json();
        const posts = Array.isArray(data)
          ? data.map(p => ({
            ...p,
            imageTags: Array.isArray(p.imageTags)
              ? p.imageTags
              : (p.imageTags ? String(p.imageTags).split(',').map(t => t.trim()).filter(Boolean) : [])
          }))
          : [];

        feedContainer.innerHTML = '';

        if (!Array.isArray(posts) || posts.length === 0) {
          feedContainer.innerHTML = '<div class="empty-state">No updates yet. Check back soon!</div>';
          return;
        }

        posts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        posts.forEach(renderPost);
      } catch (error) {
        console.error(error);
        feedContainer.innerHTML = '<div class="empty-state" style="border-color: rgba(255,0,234,0.4); color: var(--secondary);">Failed to load updates.</div>';
      }
    }

    loadFeed();
  </script>
</body>

</html>
